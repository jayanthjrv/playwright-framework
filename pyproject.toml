[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "playwright-python-async"
version = "1.0.0"
description = "Async Playwright test automation framework"
requires-python = ">=3.13"
dependencies = [
    "pytest==9.0.2",
    "pytest-xdist==3.8.0",
    "pytest-rerunfailures==16.1",
    "pytest-playwright==0.7.2",
    "pytest-asyncio==1.3.0",
    "playwright==1.58.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "pytest-html==4.2.0",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "pytest-json-report==1.5.0",
    "flake8==7.3.0",
    "black==26.1.0",
    "isort==8.0.1",
    "pytest-order==1.3.0",
]

[tool.setuptools.packages.find]
include = ["UIAutomation*", "APIAutomation*", "utils*"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "W", "B", "C"]
src = ["UIAutomation", "APIAutomation"]

[tool.ruff.per-file-ignores]
"UIAutomation/tests/*" = ["D", "S101"]
"APIAutomation/tests/*" = ["D", "S101"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["tests", "utils"]
multi_line_output = 3
include_trailing_comma = true
