[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
testpaths = UIAutomation/tests APIAutomation/tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --json-report
    --json-report-file=UIAutomation/test-results/reports/report.json
    --json-report-indent=4
    --junit-xml=UIAutomation/test-results/reports/junit.xml
    --reruns=1
    --reruns-delay=2
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    #-n 2

markers =
    description: add description to test
    smoke: mark test as smoke test